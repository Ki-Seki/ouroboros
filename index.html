<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouroboros</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐍%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>
<body class="bg-gray-100 overflow-hidden relative w-screen h-screen font-sans text-gray-800" style="background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 20px 20px;">

    <!-- GENESIS WINDOW: CORE -->
    <div id="ouroboros-core" class="draggable resizable absolute top-10 left-10 w-[420px] h-[620px] max-h-[calc(100vh-5rem)] bg-white rounded-lg border border-gray-300 shadow-md touch-none select-none flex flex-col z-50" style="transform: translate(0px, 0px);" data-x="0" data-y="0">
        <!-- Header -->
        <div class="window-header cursor-move bg-gray-800 text-white px-4 py-2 rounded-t-lg flex justify-between items-center">
            <h2 class="font-bold text-sm tracking-wide">OUROBOROS // CORE</h2>
            <div class="flex items-center gap-3 text-gray-400">
                <button id="undo-btn" title="Undo last task" class="hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"></path></svg>
                </button>
                <button id="reset-btn" title="Reset page (keeps settings)" class="hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182"></path></svg>
                </button>
                <button id="export-btn" title="Export HTML" class="hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>
            </div>
        </div>

        <!-- Token Monitor -->
        <div class="bg-gray-100 px-4 py-1 text-xs text-gray-500 border-b border-gray-200 flex justify-between items-center">
            <span>Context</span>
            <span id="usage"></span>
        </div>

        <!-- Settings -->
        <details id="settings-panel" class="border-b border-gray-200 text-xs">
            <summary class="px-4 py-2 cursor-pointer text-gray-600 hover:bg-gray-50">Settings</summary>
            <div class="px-4 pb-3 flex flex-col gap-2">
                <input type="password" id="api-key" placeholder="API Key (sk-...)" class="w-full text-xs border border-gray-300 rounded px-2 py-1 focus:outline-none focus:border-blue-500">
                <input type="text" id="api-base" placeholder="Base URL (default https://api.openai.com/v1)" class="w-full text-xs border border-gray-300 rounded px-2 py-1 focus:outline-none focus:border-blue-500">
                <input type="text" id="model" placeholder="Model (e.g. gpt-5.6-sol)" class="w-full text-xs border border-gray-300 rounded px-2 py-1 focus:outline-none focus:border-blue-500">
                <button id="save-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded transition-colors">Save Settings</button>
            </div>
        </details>

        <!-- Activity Log -->
        <div id="activity-log" class="flex-1 min-h-[100px] p-4 overflow-y-auto bg-white text-xs font-mono select-text"></div>

        <!-- Terminal / Prompt Box -->
        <div class="p-4 border-t border-gray-200 bg-gray-50 rounded-b-lg">
            <textarea id="user-prompt" placeholder="Command the Ouroboros (e.g., 'Create a calculator')" class="w-full text-sm border border-gray-300 rounded p-2 mb-2 focus:outline-none focus:border-blue-500 min-h-[80px] resize-none"></textarea>
            <div class="flex justify-between items-center">
                <span class="text-xs text-gray-400">Ctrl/⌘+Enter to send</span>
                <button id="execute-btn" class="bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium px-4 py-2 rounded transition-colors">Take a Bite 🐍</button>
            </div>
        </div>
    </div>

    <!-- EMBEDDED SYSTEM PROMPT (editable by users) -->
    <script type="text/plain" id="ouroboros-system_prompt">
## Role
You are Ouroboros, a self-editing web page. The user asks for features; you build them by running JavaScript against the live DOM of this very page, using the tools below. Work as an agent: orient, act, verify, then stop.

## Tools
- read_dom(selector, outline): read part of the page using a CSS selector. Use outline=true first to orient cheaply; set outline=false to fetch full HTML only for the parts you need.
- eval_js(code): read-only JavaScript (computed styles, element state, try a fetch). Not recorded. Never mutate here.
- run_js(code): mutate the page. Recorded and replayed in order on every load. Errors are reported back and the failed script is not recorded.

`code` is the body of an async function: `return` a string or JSON-able value to see it (return `.outerHTML` for elements); use `await import('https://esm.sh/pkg')` for libraries. Top-level `const` is local to the call; share state via `window`.
The page outline below was captured when the task started; use read_dom for anything current.

## Persistence
The page is rebuilt on every load by replaying all recorded run_js scripts, in order, from the pristine page. Therefore:
- Each script must be self-contained and succeed when replayed after the ones before it. Never rely on state from eval_js or from a failed script.
- Build UI and attach its behavior (listeners, timers) in the same script, so both come back on reload.
- Make scripts idempotent: remove your existing element (`document.getElementById('x')?.remove()`) before recreating it. To change something built earlier, write a new script that replaces it.
- A failed script may have partially changed the DOM: clean up and write a full corrected script.

## Rules
- Never modify or remove #ouroboros-core or the ouroboros-* script blocks. They are the harness that runs you.
- Build UI as floating windows: `<div id="..." class="draggable resizable absolute ...">` containing a `.window-header` child. Dragging, resizing and click-to-focus then work automatically. Use Tailwind classes. Keep windows clear of the top-left, where the core lives.
- Keep code compact. No large inline images or data URIs.
- Verify your work with read_dom or eval_js before finishing. When done, reply with a one-line summary and no tool calls. Ask the user only when the request is truly ambiguous.
- Web access: `fetch('https://r.jina.ai/' + url)` returns readable Markdown; `fetch('https://corsproxy.io/?url=' + encodeURIComponent(url))` returns raw HTML.
- Users may edit this prompt to customize you.
    </script>

    <!-- EMBEDDED STATE (filled on export so the file carries its history and mutations) -->
    <script type="application/json" id="ouroboros-state">{"history":[],"mutations":[]}</script>

    <!-- MAIN APPLICATION LOGIC -->
    <script type="module">
        // --- CONSTANTS ---
        const MAX_STEPS = 40;
        const SETTINGS_KEY = 'ouroboros:settings';
        const DEFAULT_API_BASE = 'https://api.openai.com/v1';
        const HARNESS = '#ouroboros-core, #ouroboros-system_prompt, #ouroboros-state';
        const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
        const $ = id => document.getElementById(id);

        // --- STATE ---
        // Settings stay in the browser; state contains only the history and mutations carried by exports.
        // Each exported snapshot continues in its own local storage slot.
        // The pristine page is captured before any mutation is replayed; export = pristine + content.
        const pristine = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const embedded = JSON.parse($('ouroboros-state').textContent);
        const CONTENT_KEY = `ouroboros:${embedded.savedAt ?? 'live'}`;
        const load = key => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } };
        const storedSettings = load(SETTINGS_KEY);
        const settings = {
            apiKey: storedSettings?.apiKey ?? '',
            apiBase: storedSettings?.apiBase ?? '',
            model: storedSettings?.model ?? '',
        };
        const saved = load(CONTENT_KEY) ?? embedded;
        const state = {
            history: saved.history,
            mutations: saved.mutations,
        };
        const saveSettings = () => localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        const saveContent = () => localStorage.setItem(CONTENT_KEY, JSON.stringify(state));

        let controller = null;   // AbortController of the running task
        let busy = true;         // true until replay finishes
        const runtimeErrors = [];
        const noteError = msg => { runtimeErrors.push(msg); if (runtimeErrors.length > 10) runtimeErrors.shift(); };
        addEventListener('error', e => noteError(`${e.message} (${e.filename?.split('/').pop() || 'inline'}:${e.lineno})`));
        addEventListener('unhandledrejection', e => noteError(`Unhandled rejection: ${e.reason?.message || e.reason}`));

        // --- DOM ACCESS ---
        function htmlOf(el) {
            const clone = el.cloneNode(true);
            clone.querySelectorAll(HARNESS).forEach(n => n.replaceChildren(document.createComment(' harness, omitted ')));
            clone.querySelectorAll('style').forEach(n => /tailwindcss|--tw-/.test(n.textContent) && n.remove());
            return clone.outerHTML;
        }

        // Compact tree: tag#id.classes "text", repeated siblings collapsed as ×N.
        function outlineOf(el, depth = 0, lines = []) {
            const sig = n => n.tagName.toLowerCase() + (n.id ? '#' + n.id : '') + [...n.classList].slice(0, 4).map(c => '.' + c).join('');
            const harness = el.matches(HARNESS);
            const text = harness || el.childElementCount ? '' : el.textContent.trim().replace(/\s+/g, ' ').slice(0, 40);
            lines.push('  '.repeat(depth) + sig(el) + (text ? ` "${text}"` : '') + (harness ? ' (harness)' : ''));
            if (harness) return lines;
            const kids = [...el.children];
            for (let i = 0; i < kids.length; i++) {
                let n = 1;
                while (!kids[i].id && i + n < kids.length && sig(kids[i + n]) === sig(kids[i])) n++;
                const at = lines.length;
                outlineOf(kids[i], depth + 1, lines);
                if (n > 1) { lines[at] += ` ×${n}`; i += n - 1; }
            }
            return lines;
        }

        const clip = (s, n) => s.length > n ? s.slice(0, n) + `\n… [${s.length - n} more chars]` : s;
        const show = v => { try { return v === undefined ? 'ok' : typeof v === 'string' ? v : (JSON.stringify(v, null, 1) ?? String(v)); } catch { return String(v); } };
        const runJs = async code => show(await new AsyncFunction(code)());

        // --- TOOLS ---
        const CODE_SCHEMA = { type: 'object', properties: { code: { type: 'string', description: 'Body of an async function' } }, required: ['code'], additionalProperties: false };
        const TOOLS = [
            {
                name: 'read_dom',
                description: 'Read part of the page as HTML. With outline=true, return a compact tree (tag#id.classes "text") instead. Use outline first to orient, then read only what you need.',
                parameters: { type: 'object', properties: { selector: { type: 'string', description: 'CSS selector' }, outline: { type: 'boolean' } }, required: ['selector', 'outline'], additionalProperties: false },
                run: ({ selector, outline }) => {
                    const nodes = [...document.querySelectorAll(selector)];
                    return nodes.length ? clip(nodes.map(el => outline ? outlineOf(el).join('\n') : htmlOf(el)).join('\n\n'), 30000) : `No element matches ${selector}`;
                },
            },
            {
                name: 'eval_js',
                description: 'Evaluate read-only JavaScript and return the result. Not recorded; never mutate the page here.',
                parameters: CODE_SCHEMA,
                run: ({ code }) => runJs(code),
            },
            {
                name: 'run_js',
                description: 'Mutate the page with JavaScript. Recorded and replayed in order on every page load, so it must be self-contained and idempotent. Failed scripts are not recorded.',
                parameters: CODE_SCHEMA,
                run: async ({ code }, task) => { const out = await runJs(code); state.mutations.push({ task, code }); saveContent(); return out; },
            },
        ];
        const TOOL_SCHEMAS = TOOLS.map(({ run, ...schema }) => ({ type: 'function', strict: true, ...schema }));

        async function runTool(call, task) {
            const tool = TOOLS.find(t => t.name === call.name);
            if (!tool) return `Error: unknown tool ${call.name}`;
            let args;
            try { args = JSON.parse(call.arguments); } catch { return 'Error: arguments are not valid JSON'; }
            const done = logTool(call.name, args);
            try {
                const out = await tool.run(args, task);
                done(out);
                return out;
            } catch (e) {
                const at = String(e?.stack).match(/<anonymous>:(\d+):(\d+)/);   // AsyncFunction adds 2 header lines
                const msg = `Error: ${e?.message ?? e}${at ? ` (line ${at[1] - 2}, col ${at[2]})` : ''}`;
                done(msg, true);
                return msg;
            }
        }

        // --- MODEL ---
        async function requestResponse(instructions, input, signal) {
            const base = (settings.apiBase || DEFAULT_API_BASE).replace(/\/+$/, '');
            const res = await fetch(base + '/responses', {
                method: 'POST', signal,
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${settings.apiKey}` },
                body: JSON.stringify({ model: settings.model, instructions, input, tools: TOOL_SCHEMAS }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error?.message || `${res.status} ${res.statusText}`);
            return {
                output: data.output,
                calls: data.output.filter(o => o.type === 'function_call'),
                text: data.output.filter(o => o.type === 'message').map(m => m.content.filter(c => c.type === 'output_text').map(c => c.text).join('')).join('\n'),
                usage: { input: data.usage?.input_tokens, output: data.usage?.output_tokens },
            };
        }

        function systemPrompt() {
            const parts = [$('ouroboros-system_prompt').textContent.trim()];
            parts.push('## Current page (outline)\n' + clip(outlineOf(document.body).join('\n'), 12000));
            if (runtimeErrors.length) parts.push('## Runtime errors since the last task\n' + runtimeErrors.map(e => '- ' + e).join('\n'));
            return parts.join('\n\n');
        }

        // --- AGENT LOOP ---
        async function runTask(prompt) {
            controller = new AbortController();
            setRunning(true);
            log('user', prompt);
            const task = Date.now();
            let taskTokens = 0, summary = '', responded = false;
            try {
                const instructions = systemPrompt();
                runtimeErrors.length = 0;
                const input = [...state.history.map(({ role, content }) => ({ role, content })), { role: 'user', content: prompt }];
                for (let step = 0; ; step++) {
                    if (step === MAX_STEPS) { summary = `Stopped after ${MAX_STEPS} steps.`; log('error', summary); break; }
                    const { output, calls, text, usage } = await requestResponse(instructions, input, controller.signal);
                    responded = true;
                    taskTokens += (usage.input || 0) + (usage.output || 0);
                    els.usage.textContent = `in ${fmt(usage.input)} · out ${fmt(usage.output)} · task ${fmt(taskTokens)}`;
                    input.push(...output);
                    if (text) log('assistant', text);
                    if (!calls.length) { summary = text; break; }
                    for (const call of calls) {
                        if (controller.signal.aborted) throw new DOMException('Aborted', 'AbortError');
                        input.push({ type: 'function_call_output', call_id: call.call_id, output: await runTool(call, task) });
                    }
                }
            } catch (e) {
                summary = e.name === 'AbortError' ? 'Stopped by user.' : `Error: ${e.message}`;
                log(e.name === 'AbortError' ? 'system' : 'error', summary);
            } finally {
                if (responded) {
                    state.history = [...state.history, { role: 'user', content: prompt, task }, { role: 'assistant', content: summary || '(done)', task }].slice(-20);
                    saveContent();
                }
                controller = null;
                setRunning(false);
                if (taskTokens) lastTaskUsage = `last task ${fmt(taskTokens)} · `;
                updateBaseline();
            }
        }

        // --- PERSISTENCE ---
        // The log holds model scripts ({ task, code }) and user window moves ({ layout }); order resolves conflicts.
        async function replay() {
            let failed = 0;
            for (const m of state.mutations) {
                if (m.layout) { applyLayout(m.layout); continue; }
                try { await new AsyncFunction(m.code)(); }
                catch (e) { failed++; console.error('Replay failed:', e, m.code); noteError(`Replay of a recorded script failed: ${e.message}`); }
            }
            const n = state.mutations.filter(m => m.code).length;
            if (n) log('system', `Replayed ${n} mutation(s)${failed ? `, ${failed} failed (see console)` : ''}.`);
        }

        function exportHtml() {
            const json = JSON.stringify({ ...state, savedAt: Date.now() }).replace(/</g, '\\u003c');
            const html = pristine
                .replace(/<[s]tyle[^>]*>[\s\S]*?<\/[s]tyle>/g, s => /tailwindcss|--tw-/.test(s) ? '' : s)
                .replace(/(<script type="application\/json" id="ouroboros-state">)[\s\S]*?(<\/script>)/, (_, open, close) => open + json + close);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
            a.download = `ouroboros_${new Date().toLocaleString('sv').replace(/[: ]/g, '-')}.html`;
            a.click();
            URL.revokeObjectURL(a.href);
            log('system', 'Exported successfully.');
        }

        function undo() {
            const task = state.history.at(-1)?.task;
            if (task === undefined) return log('system', 'Nothing to undo.');
            if (!confirm('Undo the last task and reload?')) return;
            state.mutations = state.mutations.filter(m => m.task !== task);
            state.history = state.history.filter(h => h.task !== task);
            saveContent();
            location.reload();
        }

        function reset() {
            const message = embedded.savedAt
                ? 'Reset to the exported snapshot? Everything done since the export is discarded; settings are kept.'
                : 'Reset the page to its pristine state? Mutations and history are cleared; settings are kept.';
            if (!confirm(message)) return;
            localStorage.removeItem(CONTENT_KEY);
            location.reload();
        }

        // --- WINDOWS ---
        const move = (el, x, y) => { el.style.transform = `translate(${x}px, ${y}px)`; Object.assign(el.dataset, { x, y }); };

        function setupWindows() {
            const remember = ({ id, dataset, style }) => {
                if (!id) return;
                state.mutations = state.mutations.filter(m => m.layout?.id !== id);
                state.mutations.push({ layout: { id, x: +dataset.x || 0, y: +dataset.y || 0, w: style.width, h: style.height } });
                saveContent();
            };
            interact('.draggable')
                .draggable({
                    allowFrom: '.window-header',
                    listeners: { move: e => move(e.target, (+e.target.dataset.x || 0) + e.dx, (+e.target.dataset.y || 0) + e.dy), end: e => remember(e.target) },
                })
                .resizable({
                    edges: { right: true, bottom: true },
                    listeners: { move: e => Object.assign(e.target.style, { width: `${e.rect.width}px`, height: `${e.rect.height}px` }), end: e => remember(e.target) },
                });
            let z = 50;
            document.addEventListener('pointerdown', e => { const w = e.target.closest('.draggable'); if (w) w.style.zIndex = ++z; });
        }

        function applyLayout({ id, x, y, w, h }) {
            const el = $(id);
            if (!el) return;
            move(el, x, y);
            if (w) el.style.width = w;
            if (h) el.style.height = h;
        }

        // --- UI ---
        const els = { log: $('activity-log'), prompt: $('user-prompt'), usage: $('usage'), btn: $('execute-btn') };
        const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        const fmt = n => n == null ? '?' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(Math.round(n));
        const LABELS = { user: ['USER', 'text-blue-600'], assistant: ['OUROBOROS', 'text-green-600'], system: ['SYSTEM', 'text-gray-500'], error: ['ERROR', 'text-red-600'] };

        function log(kind, text) {
            const [label, color] = LABELS[kind];
            els.log.insertAdjacentHTML('beforeend', `<div class="mb-2"><span class="text-gray-400">[${new Date().toLocaleTimeString()}]</span> <span class="font-bold ${color}">${label}:</span> <span class="whitespace-pre-wrap">${esc(text)}</span></div>`);
            els.log.scrollTop = els.log.scrollHeight;
        }

        function logTool(name, args) {
            const el = document.createElement('details');
            el.className = 'mb-2 text-gray-600';
            const label = [args.selector, args.outline && '(outline)'].filter(Boolean).join(' ');
            el.innerHTML = `<summary class="cursor-pointer"><span class="font-bold text-purple-600">${name}</span> <span class="text-gray-400">${esc(label)}</span> <span class="status"></span></summary>`
                + (args.code ? `<pre class="whitespace-pre-wrap bg-gray-50 border border-gray-200 rounded p-2 mt-1">${esc(args.code)}</pre>` : '')
                + `<pre class="whitespace-pre-wrap text-gray-500 mt-1 max-h-40 overflow-y-auto">…</pre>`;
            els.log.append(el);
            els.log.scrollTop = els.log.scrollHeight;
            return (result, failed) => {
                const status = el.querySelector('.status');
                status.textContent = failed ? '✗' : '✓';
                status.className = failed ? 'text-red-600' : 'text-green-600';
                el.lastElementChild.textContent = clip(result, 1500);
            };
        }

        let lastTaskUsage = '';
        function updateBaseline() {
            if (controller) return;
            try { els.usage.textContent = `${lastTaskUsage}~${fmt(systemPrompt().length / 4)} tok baseline`; }
            catch (e) { els.usage.textContent = `context unavailable: ${e.message}`; }
        }

        function setRunning(on) {
            els.btn.textContent = on ? 'Stop ■' : 'Take a Bite 🐍';
            els.btn.classList.toggle('bg-red-700', on);
            els.btn.classList.toggle('hover:bg-red-600', on);
            els.btn.classList.toggle('bg-gray-900', !on);
            els.btn.classList.toggle('hover:bg-gray-800', !on);
        }

        function submit() {
            if (busy || controller) return;
            if (!settings.apiKey || !settings.model) {
                $('settings-panel').open = true;
                return log('error', 'Set your API key and model in Settings first.');
            }
            const prompt = els.prompt.value.trim();
            if (!prompt) return;
            els.prompt.value = '';
            runTask(prompt);
        }

        function bindSettings() {
            const fields = { apiKey: 'api-key', apiBase: 'api-base', model: 'model' };
            for (const [key, id] of Object.entries(fields)) $(id).value = settings[key];
            $('settings-panel').open = !settings.apiKey;
            $('save-btn').onclick = () => {
                for (const [key, id] of Object.entries(fields)) settings[key] = $(id).value.trim();
                saveSettings();
                log('system', 'Settings saved.');
                updateBaseline();
            };
        }

        // --- INITIALIZATION ---
        async function init() {
            bindSettings();
            $('export-btn').onclick = exportHtml;
            $('reset-btn').onclick = reset;
            $('undo-btn').onclick = undo;
            els.btn.onclick = () => controller ? controller.abort() : submit();
            els.prompt.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submit(); });
            setupWindows();
            for (const h of state.history) log(h.role, h.content);

            await replay();
            busy = false;

            const core = $('ouroboros-core');
            let timeout;
            new MutationObserver(mutations => {
                if (mutations.every(m => core.contains(m.target))) return;
                clearTimeout(timeout);
                timeout = setTimeout(updateBaseline, 500);
            }).observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
            updateBaseline();
            log('system', 'Ouroboros ready.');
        }

        init();
    </script>
</body>
</html>
